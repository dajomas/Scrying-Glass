name: Branch tests

on:
  push:
    branches:
      - features/perplexity

# GitHub natively skips push workflows for commit messages containing [skip ci].
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx playwright pytest
          python -m playwright install --with-deps chromium
      - name: Python syntax and server import checks
        run: |
          python -m compileall -q scrying_glass_server.py python web_html tests tools
          python -c "import scrying_glass_server"
      - name: Python test suite (including browser fixtures)
        if: ${{ !cancelled() }}
        run: python tools/run_split_tests.py -- python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pytest regression modules
        if: ${{ !cancelled() }}
        run: >-
          python tools/run_split_tests.py -- python -m pytest -q
          tests/test_death_save_validation_2ba6607.py
          tests/test_slug_truncation_82860c4.py
      - name: JavaScript tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' test; do
            echo "::group::$test"
            python tools/run_split_tests.py -- node --test "$test" || status=1
            echo "::endgroup::"
          done < <(find tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | sort -z)
          exit "$status"
      - name: Standalone Python browser and audit checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' test; do
            echo "::group::$test"
            args=()
            if [[ "$test" == tests/audit_log_clear.py ]]; then
              args=(patched)
            fi
            python tools/run_split_tests.py -- python "$test" "${args[@]}" || status=1
            echo "::endgroup::"
          done < <(find tests -type f -name '*.py' ! -name 'test_*.py' ! -name '__init__.py' -print0 | sort -z)
          exit "$status"
