    <section id="adminButtonBar" aria-label="Admin pane controls">
      <div class="row">
        <form action="/logout" method="post">
          <button id="adminLogout" type="submit">Log out</button>
        </form>
        <button id="toggleEncounterTools" class="pane-toggle" type="button"
                aria-controls="encounterFeatures" aria-expanded="false">
          Show encounter tools
        </button>
        <button
          id="toggleCampaignPane"
          class="pane-toggle"
          type="button"
          aria-controls="campaignInputPane"
          aria-expanded="true"
        >
          Hide campaign input
        </button>
        <button
          id="toggleCharacterPane"
          class="pane-toggle"
          type="button"
          aria-controls="characterInputPane"
          aria-expanded="true"
        >
          Hide character input
        </button>
        <button
          id="toggleBattleSetupPane"
          class="pane-toggle"
          type="button"
          aria-controls="battleSetupInputPane"
          aria-expanded="true"
        >
          Hide battle setup input
        </button>
        <button
          id="toggleLairPane" data-setup-has-lair="false"
          class="pane-toggle"
          type="button"
          aria-controls="lairTools"
          aria-expanded="true"
        >
          Hide lair input
        </button>
        <button
          id="toggleMonsterPane"
          class="pane-toggle"
          type="button"
          aria-controls="monsterInputPane"
          aria-expanded="true"
        >
          Hide monster input
        </button>
        <button
          id="toggleCharacterDisplayPane"
          class="pane-toggle"
          type="button"
          aria-controls="characterDisplayPane"
          aria-expanded="true"
        >
          Hide character display
        </button>
        <button
          id="toggleMonsterDisplayPane"
          class="pane-toggle"
          type="button"
          aria-controls="monsterDisplayPane"
          aria-expanded="true"
        >
          Hide monster display
        </button>
      </div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <script src="/static/admin-message-timeout.js" defer></script>
  </header>
  <main id="adminScroll" tabindex="0" aria-label="Admin panes">
