# Command-line values override the matching values here.
network:
  bind: "0.0.0.0"
  admin_port: 3000
  client_port: 3100

# SQLite schema-v4 encounter/accounts database and uploaded images live below this path.
storage_dir: "./scrying-glass-data"

# Accounts are stored in scrying-glass.sqlite3, not configuration.
# A new installation prints a randomly generated superadmin password once.
# Existing security.users are imported once; see docs/User-Guide.md#accounts-and-sign-in.

display:
  # CSS color, CSS gradient, or image URL, e.g. "url('/media/background.jpg') center / cover".
  background: "radial-gradient(circle at 50% 15%, #16273d, #080b14 70%)"
  entry_direction: "from_bottom" # from_bottom or from_top
  exit_direction: "to_bottom"   # to_bottom or to_top
  monster_width_percent: 45
  default_monster_color: "#842029"
  default_character_color: "#1f4e79"
  # Best-effort lookup against public D&D Beyond HTML. A manually uploaded image always wins.
  dndbeyond_image_lookup: true
  # Independently enable 5e.tools for combined candidate lookup (compatibility key).
  # All enabled candidate searches must complete; failures block all candidates.
  # Legacy image/stats fallback interfaces keep their existing behavior.
  fivetools_fallback: true
  # Omitted list uses these six defaults; explicit lists replace them in this order.
  # Order controls candidate presentation and unchanged legacy first-result paths.
  # [] means no 5e.tools data requests; D&D Beyond can remain enabled.
  # Source IDs are case-sensitive; duplicates are searched once; maximum 32 entries.
  fivetools_sources: ["MM", "XMM", "PHB", "XPHB", "DMG", "XDMG"]
  fivetools_data_base_url: "https://5e.tools/data/bestiary"
  fivetools_image_base_url: "https://5e.tools/img"
  # Open5e v2 API candidate lookup (all documents), listed after D&D Beyond and 5e.tools.
  # Candidates show document, game system, publisher and licence. No API key is needed.
  # A superadmin can override all three provider switches on the User management page.
  open5e_lookup: true
  open5e_base_url: "https://api.open5e.com/v2"
